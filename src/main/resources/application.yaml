spring:
  application:
    name: gestion-ecole
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:smtp.mail.yahoo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:franckyaj@yahoo.com}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: gestion-ecole
    access-token-ttl: PT15M
    refresh-token-ttl: P30D

app:
  learning:
    storage-root: ${LEARNING_STORAGE_ROOT:${java.io.tmpdir}/gestion-ecole/learning-private}
    max-file-size-bytes: ${LEARNING_MAX_FILE_SIZE_BYTES:10485760}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  employees:
    invitation-accept-url: ${EMPLOYEE_INVITATION_ACCEPT_URL:${STAFF_INVITATION_ACCEPT_URL:http://localhost:3000/accept-invitation}}
    invitation-from: ${EMPLOYEE_INVITATION_FROM:${STAFF_INVITATION_FROM:${SMTP_USERNAME:franckyaj@yahoo.com}}}
  guardians:
    invitation-accept-url: ${GUARDIAN_INVITATION_ACCEPT_URL:http://localhost:3000/accept-guardian-invitation}
    invitation-from: ${GUARDIAN_INVITATION_FROM:${SMTP_USERNAME:franckyaj@yahoo.com}}

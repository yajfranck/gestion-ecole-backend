      summary: Consulter la feuille d'appel d'une classe
      description: 'Autorisation fonctionnelle : hasAuthority(''can_attendance_read'').
        Requiert can_attendance_read. Une ligne existe pour chaque élève actif inscrit;
        status vaut PRESENT, ABSENT ou NON_RENSEIGNE. La date doit être comprise dans
        l''année scolaire. Le paramètre classroomId facultatif filtre les élèves inscrits
        et tous les totaux à une salle active de cette classe/année/école. Sans filtre,
        toutes les salles sont incluses et classroomId vaut null dans la réponse.'
      operationId: getClassAttendance
      parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: schoolClassId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: classroomId
        in: query
        required: false
        description: Salle active de la classe, de cette année et de cet établissement.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Feuille et totaux présents, absents et non renseignés.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttendanceSheetResponse"
        '400':
          description: Date invalide/hors année ou classroomId mal formé.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: Établissement, année, classe ou salle absents/inactifs/hors
            périmètre.
      x-permission-expression: hasAuthority('can_attendance_read')
      security:
      - bearerAuth: []
  "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/attendance/{date}":
    put:
      tags:
      - Présences
      summary: Enregistrer ou corriger les pointages d’une salle pour la journée
      description: 'Autorisation fonctionnelle : hasAuthority(''can_attendance_write'').
        Requiert can_attendance_write. Upsert idempotent par inscription/date; seuls
        les élèves transmis sont créés ou corrigés, les élèves omis restent inchangés.
        Pour modifier une ligne existante, expectedUpdatedAt doit égaler son updatedAt
        courant; une répétition identique sans changement peut omettre cette valeur.
        Les doublons strictement identiques sont acceptés; des doublons contradictoires
        invalident tout le lot. Toute validation est faite avant écriture et le lot
        est transactionnel. classroomId est obligatoire dans le corps, même pour une
        classe à salle unique. La salle doit être active et appartenir à la classe/année/école
        de l’URL. Tous les élèves doivent être inscrits dans cette salle ; un lot
        mixte est rejeté en entier. La réponse et les compteurs sont limités à la
        salle choisie. La classe est verrouillée comme pour les transferts d’inscription
        pendant la validation et l’écriture. Aucun pointage historique n’est supprimé,
        l’unicité inscription/date est conservée. Aucune migration nécessaire.'
      operationId: putClassAttendance
      parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: schoolClassId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AttendanceBatchRequest"
            examples:
              rollCall:
                value:
                  entries:
                  - studentId: 9201df13-6b50-4a4a-a513-d7d554432334
                    status: PRESENT
                  - studentId: b9fd7208-5e49-48cb-9e50-22084540ad15
                    status: ABSENT
                    absenceJustified: true
                    comment: Maladie signalée
                  classroomId: e7262707-b15c-48fa-a556-64c2cc465b2b
      responses:
        '200':
          description: Feuille de la seule salle sélectionnée, avec classroomId et
            compteurs limités à cette salle.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AttendanceSheetResponse"
        '400':
          description: classroomId absent/null/mal formé, lot vide/invalide, entrée
            null, élève non inscrit dans cette salle, date hors année, justification
            incohérente ou doublons contradictoires. Aucune écriture conservée.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: Établissement, année, classe ou salle absents/inactifs/hors
            périmètre.
        '409':
          description: Écriture concurrente incompatible; le lot est annulé.
      x-permission-expression: hasAuthority('can_attendance_write')
      security:
      - bearerAuth: []
  "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/students/{studentId}/attendance":
    get:
      tags:
      - Présences
      summary: Consulter l'historique de présence d'un élève
      description: 'Autorisation fonctionnelle : hasAuthority(''can_attendance_read'').
        Requiert can_attendance_read. from et to sont inclusifs, doivent être ordonnés
        et compris dans l''année scolaire; la plage est limitée à 366 jours. records
        contient uniquement les journées pointées. L''historique reste consultable
        après archivage de l''élève ou de sa classe.'
      operationId: getStudentAttendance
      parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true

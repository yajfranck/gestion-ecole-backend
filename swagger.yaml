        de l’année sont pris en compte; aucun week-end fermé implicitement. Une semaine
        contient sept journées du lundi au dimanche; les jours hors année ont withinAcademicYear=false
        et aucune entrée.'
      operationId: getClassroomDailyTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableDayResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      x-permission-expression: hasAuthority('can_timetable_read')
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/week"

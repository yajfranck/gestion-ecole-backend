  /api/v1/establishments/{establishmentId}/school-years:
    get:
      tags:
        - Calendrier scolaire
      summary: Lister les années scolaires
      description: >-
        Requiert can_academic_year_read dans le périmètre de gestion existant,
        ou can_guardian_read_children avec au moins un enfant actif lié dans cet
        établissement et une licence active incluant PARENT_PORTAL. Le compte
        parent, le tuteur et l'établissement doivent être actifs. Retourne toutes
        les années actives de l'établissement, y compris celles sans inscription
        des enfants du parent, de la plus récente à la plus ancienne. Un parent
        également administrateur conserve son périmètre de gestion. Aucun droit
        de détail, de périodes ou d'écriture supplémentaire n'est accordé.
      operationId: getAcademicYears
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Années scolaires actives, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYearResponse'
        '400':
          description: Identifiant establishmentId mal formé.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permissions ou licence requise absentes, ou parent sans enfant actif lié à cet établissement.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
    post:
      tags:
        - Calendrier scolaire
      summary: Créer une année scolaire
      description: Requiert can_academic_year_create. Les dates sont configurables par établissement.
      operationId: createAcademicYear
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAcademicYearRequest'
      responses:
        '201':
          description: Année scolaire créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYearResponse'
        '400':
          description: Corps invalide ou dates incohérentes.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_academic_year_create absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
        '409':
          description: Nom déjà utilisé dans l'établissement.

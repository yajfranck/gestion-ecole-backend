openapi: 3.1.0
info:
  title: Gestion Ecole API
  version: 1.0.0
  description: |
    Contrat HTTP de l'application Gestion Ecole.
    Les endpoints Employee sont filtrés selon l'établissement du responsable.
    Les routes globales de consultation des comptes, rôles et permissions exigent
    ADMIN_ACCESS. La gestion des rôles d'école est limitée à l'établissement via
    can_role_* et can_permission_read. ADMIN accède aux établissements, à leur création
    avec invitation du premier administrateur et au dashboard plateforme. Aucun rôle n'a ADMIN_ACCESS par défaut après V21;
    les routes globales de sécurité nécessitent un provisionnement distinct.
    La gestion des élèves exige can_student_*; les inscriptions exigent
    can_enrollment_read ou can_enrollment_create; les employés et les
    postes utilisent leurs permissions dédiées. Les endpoints de gestion générale
    exigent ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT; les postes ont aussi
    des permissions dédiées
    can_position_read, can_position_create, can_position_update,
    can_position_assign_roles et can_position_delete. La fiche personnelle
    exige STAFF_ACCESS. Les tuteurs consultent uniquement les enfants liés à
    leur compte via can_guardian_read_children.
    La console H2 est une interface locale, pas une opération REST.
servers:
  - url: http://localhost:8080
    description: Serveur local
tags:
  - name: Authentification
  - name: Administration de la sécurité
  - name: Établissements
  - name: Catalogue scolaire
  - name: Calendrier scolaire
  - name: Élèves
  - name: Parents et tuteurs
  - name: Frais et paiements
  - name: Inscriptions
  - name: Postes
  - name: Personnel
  - name: Contenus pédagogiques
  - name: Licences
  - name: Dashboard
  - name: Emplois du temps
  - name: Reprise annuelle
  - name: Santé
paths:
  "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classrooms/rollover":
    parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Établissement du membre connecté.
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Année scolaire cible active.
    get:
      tags:
      - Reprise annuelle
      operationId: previewSchoolYearRollover
      summary: Préparer la reprise de salles depuis la précédente année disponible
      description: 'Requiert can_school_year_rollover, compte/employé actif du même
        établissement et SCHOOL_MANAGEMENT, revérifiés en base. Source : fin la plus
        récente avant le début de la cible, puis début et UUID pour départager. Les
        années, classes et salles sources archivées sont proposées. Sans précédente
        : sourceYear=null, classrooms=[], fees=[]. Matières actives uniquement ; frais
        individuels exclus. Les types et moyens de paiement sont communs aux années.
        Sans TUITION, financeAvailable=false et toutes les listes financières sont vides.
        Aucun effet de bord.'
      security: &1
      - bearerAuth: []
      responses:
        '200':
          description: Configuration source proposée, éventuellement sans précédente.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SchoolYearRolloverPreview"
        '400': &2
          description: Corps invalide, salles doublonnées, source autre que la précédente,
            échéance hors cible ou type non actif/hors établissement. Aucune écriture
            partielle.
        '401': &3
          description: JWT absent ou invalide.
        '403': &4
          description: Permission, compte employé actif ou licence SCHOOL_MANAGEMENT
            manquants ; TUITION requis si des frais sont à copier.
        '404': &5
          description: Cible inexistante/inactive/hors périmètre, salle hors source
            ou aucune précédente disponible au POST.
    post:
      tags:
      - Reprise annuelle
      operationId: copyPreviousSchoolYearClassrooms
      summary: Reprendre plusieurs salles, matières et paramétrage financier
      description: 'Requiert can_school_year_rollover et SCHOOL_MANAGEMENT ; TUITION
        si des frais sont retenus. Reprise atomique et répétable, années verrouillées.
        Copie des classes (code/nom/série) et seules salles choisies, actives en cible,
        sans DEFAULT implicite. Matières actives réutilisées, affectations cibles réactivées
        si nécessaire. Types/modes de paiement globaux réutilisés, type archivé à remplacer
        explicitement. Frais actifs annuels optionnels ou liés aux classes sélectionnées,
        hors frais individuels : montants/devises conservés, échéances décalées selon
        les années de début (29 février vers 28 février), surcharge possible. Frais
        multiclasse unique, étendu au fil des lots. Sans provenance, classe de même
        code/nom/série et salle de même code/nom compatibles réutilisées ; codes/noms
        des ressources déjà liées sont conservés. Frais de même nom réutilisable seulement
        si type, montant, devise, échéance et portée annuelle/classes correspondent.
        Aucun élève, inscription, créance/impayé, paiement, reçu, emploi du temps ou
        contenu pédagogique copié. Aucune facturation des inscriptions déjà présentes
        dans la cible ; application des frais ultérieure explicite via /tuition-fees/{feeId}/apply.
        Les frais copiés sont pris en compte aux futures inscriptions. Toute incompatibilité
        annule la transaction. Provenance et auteur enregistrés.'
      security: *1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SchoolYearRolloverRequest"
            example:
              sourceAcademicYearId: 11111111-1111-4111-8111-111111111111
              classroomIds:
              - 22222222-2222-4222-8222-222222222222
              includeAnnualFees: true
      responses:
        '200':
          description: Correspondances source/cible et créations/réutilisations, y compris
            lors d’une répétition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SchoolYearRolloverResponse"
        '400': *2
        '401': *3
        '403': *4
        '404': *5
        '409':
          description: Classe, salle ou frais cible incompatible/archivé ; conflit d’intégrité.
            Toute la demande est annulée.
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter le modèle hebdomadaire d’une salle
      description: Requiert can_timetable_read. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Créneaux actifs triés par jour,
        heure et identifiant. Les jours non ouvrés ne retirent pas les créneaux du modèle.
      operationId: getClassroomTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      parameters:
      - name: dayOfWeek
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/TimetableDayOfWeek"
    post:
      tags:
      - Emplois du temps
      summary: Créer un créneau hebdomadaire pour une salle
      description: Requiert can_timetable_create. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Matière active affectée à la classe.
        Enseignant facultatif, sinon personnel actif de l’école. Dates inclusives dans
        l’année et heures locales en minutes entières. Les chevauchements d’un même
        groupe, enseignant ou roomCode sont refusés, y compris entre années actives
        qui se recouvrent. Les fermetures ne libèrent pas les réservations du modèle.
        Les écritures d’une école sont sérialisées.
      operationId: createClassroomTimetableEntry
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimetableEntryRequest"
            example:
              subjectId: 11111111-1111-4111-8111-111111111111
              teacherId: 22222222-2222-4222-8222-222222222222
              dayOfWeek: MONDAY
              startTime: '08:00'
              endTime: '09:00'
              validFrom: '2026-09-01'
              validUntil: '2027-06-30'
              roomCode: LAB-A
      responses:
        '201':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/{entryId}"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter un créneau actif
      description: Requiert can_timetable_read. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Le créneau doit appartenir à cette
        salle.
      operationId: getClassroomTimetableEntry
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
    put:
      tags:
      - Emplois du temps
      summary: Remplacer les paramètres d’un créneau
      description: 'Requiert can_timetable_update. Personnel actif rattaché à cette
        école, compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions
        et le lien au compte sont revérifiés en base. Année, classe et salle actives;
        aucun accès parent ou ADMIN plateforme implicite. Corps complet: les enseignants/locaux
        omis deviennent null et les dates omises reprennent les bornes de l’année. Identité,
        salle, auteur/date de création et provenance de copie conservés. Vérification
        des matières, enseignants, dates et conflits comme à la création.'
      operationId: updateClassroomTimetableEntry
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimetableEntryRequest"
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
    delete:
      tags:
      - Emplois du temps
      summary: Archiver un créneau
      description: Requiert can_timetable_delete. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Archivage logique avec auteur et
        date, sans suppression de l’historique. Le créneau cesse de réserver les ressources.
      operationId: archiveClassroomTimetableEntry
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Créneau archivé.
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/copy"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Emplois du temps
      summary: Dupliquer un emploi du temps vers une autre salle
      description: Requiert can_timetable_copy et, si replaceExisting=true, can_timetable_delete
        dans le jeton et en base. Personnel actif rattaché à cette école, compte actif
        non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien au compte
        sont revérifiés en base. Année, classe et salle actives; aucun accès parent
        ou ADMIN plateforme implicite. Cible différente dans la même école et année.
        Une autre classe est permise si toutes les matières y sont actives et affectées.
        Source non vide. Par défaut ajout sans enseignants ni locaux physiques; teacherMappings
        prime sur copyTeachers. Conserver enseignants ou locaux peut créer un conflit
        avec la source. replaceExisting archive tous les créneaux actifs de la cible.
        Toutes les références et tous les conflits sont validés avant écriture; échec
        atomique sans altérer source ou destination. Nouveaux UUID et copiedFromId,
        auteur authentifié. Une copie répétée est soumise aux mêmes conflits.
      operationId: copyClassroomTimetable
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CopyTimetableRequest"
            example:
              targetClassroomId: 33333333-3333-4333-8333-333333333333
              replaceExisting: false
              copyTeachers: false
              copyRoomCodes: false
              teacherMappings:
                22222222-2222-4222-8222-222222222222: 44444444-4444-4444-8444-444444444444
      responses:
        '201':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/day"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter les cours d’une journée
      description: Requiert can_timetable_read. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Date obligatoire dans l’année. Heures
        locales sans conversion UTC. Les périodes de validité et les jours non ouvrés
        de l’année sont pris en compte; aucun week-end fermé implicitement. Une semaine
        contient sept journées du lundi au dimanche; les jours hors année ont withinAcademicYear=false
        et aucune entrée.
      operationId: getClassroomDailyTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableDayResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/week"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter les cours d’une semaine
      description: Requiert can_timetable_read. Personnel actif rattaché à cette école,
        compte actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et
        le lien au compte sont revérifiés en base. Année, classe et salle actives; aucun
        accès parent ou ADMIN plateforme implicite. Date obligatoire dans l’année. Heures
        locales sans conversion UTC. Les périodes de validité et les jours non ouvrés
        de l’année sont pris en compte; aucun week-end fermé implicitement. Une semaine
        contient sept journées du lundi au dimanche; les jours hors année ont withinAcademicYear=false
        et aucune entrée.
      operationId: getClassroomWeeklyTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableWeekResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
  "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/timetable/non-working-days":
    parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Lister les jours non ouvrés de l’année
      description: Requiert can_timetable_read, personnel actif lié à cette école et
        SCHOOL_MANAGEMENT. Année active. Permissions revérifiées en base. Liste triée
        par date, applicable à toutes les salles de cette année pour les vues datées
        des emplois du temps.
      operationId: getTimetableNonWorkingDays
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableNonWorkingDay"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
    put:
      tags:
      - Emplois du temps
      summary: Remplacer les jours non ouvrés de l’année
      description: Requiert can_timetable_update, personnel actif lié à cette école
        et SCHOOL_MANAGEMENT. Année active. Remplacement atomique de toute la liste;
        days=[] efface les jours. Dates uniques dans l’année, noms non blancs. Une erreur
        conserve le calendrier existant. Ces fermetures ne libèrent pas les réservations
        du modèle hebdomadaire et ne modifient pas le module de présence.
      operationId: replaceTimetableNonWorkingDays
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimetableNonWorkingDaysRequest"
            example:
              days:
              - date: '2026-12-25'
                name: Jour férié
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableNonWorkingDay"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte ou employé inactif/non lié, permission absente ou révoquée,
            ou SCHOOL_MANAGEMENT inactif.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Consulter le dashboard administrateur dans son périmètre authentifié
      description: >-
        Requiert can_dashboard_read et un compte actif non verrouillé ayant actuellement
        le rôle ADMIN ou ESTABLISHMENT_ADMIN. Les rôles et la permission sont revérifiés
        en base. ADMIN reçoit la vue PLATFORM sans données métier des écoles.
        L'administrateur d'établissement reçoit la vue ESTABLISHMENT de son école
        déterminée par sa fiche de personnel active liée au compte, y compris si
        son rôle est hérité du poste. Aucun établissement client ne remplace ce périmètre.
        Les filtres concernent seulement la vue établissement et sont refusés à ADMIN.
        Sans filtre, sélection de l'année active contenant la date UTC courante,
        sinon de la plus récente année active. La date par défaut est ramenée aux
        bornes de l'année. Sans année disponible, agrégats annuels vides et année null.
        Les blocs attendance, finance et learning valent null sans les fonctionnalités
        actives ATTENDANCE, TUITION et LEARNING_CONTENT respectivement. Les compteurs
        de gestion et la licence restent consultables. Les devises sont séparées ;
        les paiements partiels sont agrégés avant de sommer les créances. Les montants
        incluent tous les paiements enregistrés pour les créances de l'année, sans
        filtre sur leur date d'encaissement. Aucun corps de requête.
      operationId: getDashboard
      security: [{bearerAuth: []}]
      parameters:
        - name: academicYearId
          in: query
          required: false
          description: Année active de l'établissement authentifié ; réservé à la vue établissement.
          schema: {type: string, format: uuid}
        - name: date
          in: query
          required: false
          description: Journée des présences et référence des échéances ; doit être dans l'année sélectionnée. Réservé à la vue établissement.
          schema: {type: string, format: date}
      responses:
        '200':
          description: Agrégats adaptés au rôle avec generatedAt en UTC ; une seule des sections platform et establishment est renseignée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardResponse'}
        '400': {description: Format UUID/date invalide, date hors année ou filtres incompatibles avec la vue plateforme/sans année.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission, compte, rôle administrateur ou fiche de personnel liée refusé.}
        '404': {description: Établissement désactivé ou année absente, archivée ou hors périmètre.}
  /api/v1/login:
    post:
      tags:
        - Authentification
      summary: Authentifier un compte
      description: Retourne un JWT d'accès signé en HS256 et un refresh token opaque. Le JWT expire après 15 minutes et le refresh token après 30 jours par défaut.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: admin-tech
              password: <mot-de-passe>
      responses:
        '200':
          description: Authentification réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: <jwt>
                tokenType: Bearer
                expiresIn: 900
                refreshToken: <refresh-token>
                refreshExpiresIn: 2592000
        '400':
          description: Corps absent, JSON invalide ou données ne respectant pas les contraintes de validation.
        '401':
          description: Identifiants invalides. La réponse ne contient pas de corps.

  /api/v1/refresh:
    post:
      tags:
        - Authentification
      summary: Renouveler les jetons
      description: |
        Renouvelle le JWT d'accès sans exiger celui-ci dans la requête.
        Le refresh token est à usage unique et est remplacé à chaque succès.
        Le rejeu d'un ancien refresh token révoque les tokens actifs de sa famille.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Jeton d'accès et refresh token renouvelés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Corps absent, JSON invalide ou refresh token blanc.
        '401':
          description: Refresh token inconnu, expiré, révoqué ou associé à un compte inactif.

  /api/v1/user:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les comptes utilisateur
      description: Retourne les comptes triés par nom d'utilisateur et leurs codes de rôles. Les hashes de mot de passe ne sont jamais exposés.
      operationId: getUsers
      responses:
        '200':
          description: Liste des comptes, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccountResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.

  /api/v1/user/me/password:
    put:
      tags:
        - Authentification
      summary: Modifier son mot de passe
      description: Requiert un compte authentifié. Vérifie le mot de passe actuel, enregistre le nouveau avec BCrypt et révoque les refresh tokens actifs.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Mot de passe modifié; les refresh tokens actifs ont été révoqués.
        '400':
          description: Nouveau mot de passe invalide, trop court, trop long ou identique à l'actuel.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Mot de passe actuel incorrect.

  /api/v1/role:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les rôles
      description: Retourne les rôles et leurs permissions, triés par code.
      operationId: getRoles
      responses:
        '200':
          description: Liste des rôles, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.
    post:
      tags:
        - Administration de la sécurité
      summary: Créer un rôle
      description: Requiert ADMIN_ACCESS. Toutes les permissions doivent déjà exister dans le catalogue.
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Rôle créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Code, nom ou permissions invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission ADMIN_ACCESS absente.
        '409':
          description: Code de rôle déjà utilisé.

  /api/v1/role/{code}:
    put:
      tags:
        - Administration de la sécurité
      summary: Modifier le nom, la description et les permissions d'un rôle
      description: Requiert ADMIN_ACCESS. Le code est immuable et ADMIN ne peut pas recevoir ADMIN_ACCESS.
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rôle modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Nom, permissions ou invariant du rôle ADMIN invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission ADMIN_ACCESS absente.
        '404':
          description: Rôle inexistant.

  /api/v1/permission:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les permissions
      description: Retourne le catalogue des permissions, trié par code.
      operationId: getPermissions
      responses:
        '200':
          description: Liste des permissions, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.

  /api/v1/establishments:
    get:
      tags:
        - Établissements
      summary: Lister les établissements accessibles
      description: Requiert ADMIN_ACCESS, can_establishment_read ou ESTABLISHMENT_STAFF_MANAGEMENT. ADMIN possède can_establishment_read et reçoit tous les établissements; cette lecture n'accorde pas les autres opérations globales.
      operationId: getEstablishments
      responses:
        '200':
          description: Liste des établissements accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS, can_establishment_read ou ESTABLISHMENT_STAFF_MANAGEMENT.
    post:
      tags:
        - Établissements
      summary: Créer un établissement et inviter son administrateur
      description: Réservé au rôle ADMIN avec can_establishment_onboard. La création, le poste d'administrateur et l'invitation sont transactionnels.
      operationId: onboardEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardEstablishmentRequest'
      responses:
        '201':
          description: Établissement créé et invitation envoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentOnboardingResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Rôle ADMIN ou permission can_establishment_onboard absent.
        '409':
          description: Code établissement, matricule ou adresse email déjà utilisé.
  /api/v1/establishments/{establishmentId}:
    patch:
      tags:
        - Établissements
      summary: Modifier le code ou le nom d'un établissement
      description: Requiert le rôle global ADMIN ou can_establishment_update. Pour un compte local, le service vérifie le rôle effectif ESTABLISHMENT_ADMIN et le rattachement exact à l'établissement. Les champs absents restent inchangés; null, chaîne vide ou blanche sont refusés.
      operationId: updateEstablishment
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEstablishmentRequest'
            examples:
              rename:
                value:
                  name: École Exemple
              changeCode:
                value:
                  code: ECOLE-001
      responses:
        '200':
          description: Établissement modifié; id, enabled et createdAt sont conservés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentResponse'
        '400':
          description: Corps vide, champ null/vide/blanc, mauvais type ou valeur trop longue.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Ni rôle ADMIN global, ni permission d'update avec rattachement et rôle local valides.
        '404':
          description: Établissement absent ou désactivé.
        '409':
          description: Code déjà utilisé.
    delete:
      tags:
        - Établissements
      summary: Désactiver un établissement
      description: Soft-delete; désactive également les membres et leurs comptes, puis révoque leurs refresh tokens. Requiert ADMIN_ACCESS, non attribué au rôle ADMIN d'onboarding.
      operationId: deactivateEstablishment
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Établissement et personnel désactivés.
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/attendance:
    get:
      tags:
        - Présences
      summary: Consulter la feuille d'appel d'une classe
      description: Requiert can_attendance_read. Une ligne existe pour chaque élève actif inscrit; status vaut PRESENT, ABSENT ou NON_RENSEIGNE. La date doit être comprise dans l'année scolaire.
      operationId: getClassAttendance
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: schoolClassId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Feuille et totaux présents, absents et non renseignés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSheetResponse'
        '400':
          description: Date invalide ou hors bornes de l'année.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission attendance absente ou établissement hors périmètre.
        '404':
          description: Établissement, année ou classe absents/inactifs.
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/attendance/{date}:
    put:
      tags:
        - Présences
      summary: Enregistrer ou corriger les pointages d'une classe pour la journée
      description: Requiert can_attendance_write. Upsert idempotent par inscription/date; seuls les élèves transmis sont créés ou corrigés, les élèves omis restent inchangés. Pour modifier une ligne existante, expectedUpdatedAt doit égaler son updatedAt courant; une répétition identique sans changement peut omettre cette valeur. Les doublons strictement identiques sont acceptés; des doublons contradictoires invalident tout le lot. Toute validation est faite avant écriture et le lot est transactionnel.
      operationId: putClassAttendance
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: schoolClassId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBatchRequest'
            examples:
              rollCall:
                value:
                  entries:
                    - studentId: 9201df13-6b50-4a4a-a513-d7d554432334
                      status: PRESENT
                    - studentId: b9fd7208-5e49-48cb-9e50-22084540ad15
                      status: ABSENT
                      absenceJustified: true
                      comment: Maladie signalée
      responses:
        '200':
          description: Feuille recalculée après application du lot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSheetResponse'
        '400':
          description: Lot vide/invalide, élève non inscrit, date hors année, justification incohérente ou doublons contradictoires. Aucune écriture n'est conservée.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission attendance absente ou établissement hors périmètre.
        '404':
          description: Établissement, année ou classe absents/inactifs.
        '409':
          description: Écriture concurrente incompatible; le lot est annulé.
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/students/{studentId}/attendance:
    get:
      tags:
        - Présences
      summary: Consulter l'historique de présence d'un élève
      description: Requiert can_attendance_read. from et to sont inclusifs, doivent être ordonnés et compris dans l'année scolaire; la plage est limitée à 366 jours. records contient uniquement les journées pointées. L'historique reste consultable après archivage de l'élève ou de sa classe.
      operationId: getStudentAttendance
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pointages de l'élève dans la plage demandée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceHistoryResponse'
        '400':
          description: Plage invalide, hors année ou supérieure à 366 jours.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission attendance absente ou établissement hors périmètre.
        '404':
          description: Élève sans inscription dans l'année ou contexte absent.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN.
        '404':
          description: Établissement introuvable.

  /api/v1/establishments/{establishmentId}/roles:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les rôles accessibles dans un établissement
      description: Requiert can_role_read. Retourne les rôles système consultables et les rôles locaux; seul un rôle local est modifiable.
      operationId: getEstablishmentRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rôles système et locaux accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentRoleResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
    post:
      tags:
        - Administration de la sécurité
      summary: Créer un rôle local
      description: Requiert can_role_create. Les codes sont uniques dans toute la plateforme et les permissions plateforme sont refusées.
      operationId: createEstablishmentRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Rôle local créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRoleResponse'
        '400':
          description: Rôle ou permissions invalides, incluant une permission réservée à la plateforme.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
        '409':
          description: Code déjà utilisé par un rôle de la plateforme.

  /api/v1/establishments/{establishmentId}/roles/{code}:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: code
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    put:
      tags:
        - Administration de la sécurité
      summary: Modifier un rôle local
      description: Requiert can_role_update. Les rôles système et ceux d'un autre établissement ne sont pas modifiables.
      operationId: updateEstablishmentRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rôle local modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRoleResponse'
        '400':
          description: Permissions invalides ou réservées à la plateforme.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
        '404':
          description: Rôle local introuvable.

  /api/v1/establishments/{establishmentId}/permissions:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les permissions assignables dans un établissement
      description: Requiert can_permission_read. Le catalogue est en lecture seule et omet les permissions plateforme.
      operationId: getEstablishmentPermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalogue des permissions assignables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.

  /api/v1/establishments/{establishmentId}/subjects:
    get:
      tags:
        - Catalogue scolaire
      summary: Lister les matières
      description: Requiert can_subject_read.
      operationId: getSubjects
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matières actives de l'établissement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_read absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
    post:
      tags:
        - Catalogue scolaire
      summary: Créer une matière
      description: Requiert can_subject_create; le code est unique dans l'établissement et normalisé en majuscules.

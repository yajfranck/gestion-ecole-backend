openapi: 3.1.0
info:
  title: Gestion Ecole API
  version: 1.0.0
  description: |
    Contrat HTTP de l'application Gestion Ecole.
    Les endpoints Employee sont filtrés selon l'établissement du responsable.
    Les routes globales de consultation des comptes, rôles et permissions exigent
    ADMIN_ACCESS. La gestion des rôles d'école est limitée à l'établissement via
    can_role_* et can_permission_read. ADMIN est réservé à la création d'un établissement et à l'invitation
    de son premier administrateur. Aucun rôle n'a ADMIN_ACCESS par défaut après V21;
    les routes globales de sécurité nécessitent un provisionnement distinct.
    La gestion des élèves exige can_student_*; les inscriptions exigent
    can_enrollment_read ou can_enrollment_create; les employés et les
    postes utilisent leurs permissions dédiées. Les endpoints de gestion générale
    exigent ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT; les postes ont aussi
    des permissions dédiées
    can_position_read, can_position_create, can_position_update,
    can_position_assign_roles et can_position_delete. La fiche personnelle
    exige STAFF_ACCESS. Les tuteurs consultent uniquement les enfants liés à
    leur compte via can_guardian_read_children.
    La console H2 est une interface locale, pas une opération REST.
servers:
  - url: http://localhost:8080
    description: Serveur local
tags:
  - name: Authentification
  - name: Administration de la sécurité
  - name: Établissements
  - name: Catalogue scolaire
  - name: Calendrier scolaire
  - name: Élèves
  - name: Parents et tuteurs
  - name: Frais et paiements
  - name: Inscriptions
  - name: Postes
  - name: Personnel
  - name: Santé
paths:
  /api/v1/login:
    post:
      tags:
        - Authentification
      summary: Authentifier un compte
      description: Retourne un JWT d'accès signé en HS256 et un refresh token opaque. Le JWT expire après 15 minutes et le refresh token après 30 jours par défaut.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: admin-tech
              password: <mot-de-passe>
      responses:
        '200':
          description: Authentification réussie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: <jwt>
                tokenType: Bearer
                expiresIn: 900
                refreshToken: <refresh-token>
                refreshExpiresIn: 2592000
        '400':
          description: Corps absent, JSON invalide ou données ne respectant pas les contraintes de validation.
        '401':
          description: Identifiants invalides. La réponse ne contient pas de corps.

  /api/v1/refresh:
    post:
      tags:
        - Authentification
      summary: Renouveler les jetons
      description: |
        Renouvelle le JWT d'accès sans exiger celui-ci dans la requête.
        Le refresh token est à usage unique et est remplacé à chaque succès.
        Le rejeu d'un ancien refresh token révoque les tokens actifs de sa famille.
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Jeton d'accès et refresh token renouvelés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Corps absent, JSON invalide ou refresh token blanc.
        '401':
          description: Refresh token inconnu, expiré, révoqué ou associé à un compte inactif.

  /api/v1/user:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les comptes utilisateur
      description: Retourne les comptes triés par nom d'utilisateur et leurs codes de rôles. Les hashes de mot de passe ne sont jamais exposés.
      operationId: getUsers
      responses:
        '200':
          description: Liste des comptes, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccountResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.

  /api/v1/user/me/password:
    put:
      tags:
        - Authentification
      summary: Modifier son mot de passe
      description: Requiert un compte authentifié. Vérifie le mot de passe actuel, enregistre le nouveau avec BCrypt et révoque les refresh tokens actifs.
      operationId: changeOwnPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Mot de passe modifié; les refresh tokens actifs ont été révoqués.
        '400':
          description: Nouveau mot de passe invalide, trop court, trop long ou identique à l'actuel.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Mot de passe actuel incorrect.

  /api/v1/role:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les rôles
      description: Retourne les rôles et leurs permissions, triés par code.
      operationId: getRoles
      responses:
        '200':
          description: Liste des rôles, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.
    post:
      tags:
        - Administration de la sécurité
      summary: Créer un rôle
      description: Requiert ADMIN_ACCESS. Toutes les permissions doivent déjà exister dans le catalogue.
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Rôle créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Code, nom ou permissions invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission ADMIN_ACCESS absente.
        '409':
          description: Code de rôle déjà utilisé.

  /api/v1/role/{code}:
    put:
      tags:
        - Administration de la sécurité
      summary: Modifier le nom, la description et les permissions d'un rôle
      description: Requiert ADMIN_ACCESS. Le code est immuable et ADMIN ne peut pas recevoir ADMIN_ACCESS.
      operationId: updateRole
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rôle modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          description: Nom, permissions ou invariant du rôle ADMIN invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission ADMIN_ACCESS absente.
        '404':
          description: Rôle inexistant.

  /api/v1/permission:
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les permissions
      description: Retourne le catalogue des permissions, trié par code.
      operationId: getPermissions
      responses:
        '200':
          description: Liste des permissions, éventuellement vide.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission ADMIN_ACCESS.

  /api/v1/establishments:
    get:
      tags:
        - Établissements
      summary: Lister les établissements accessibles
      description: Requiert ADMIN_ACCESS, can_establishment_read ou ESTABLISHMENT_STAFF_MANAGEMENT. ADMIN possède can_establishment_read et reçoit tous les établissements; cette lecture n'accorde pas les autres opérations globales.
      operationId: getEstablishments
      responses:
        '200':
          description: Liste des établissements accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS, can_establishment_read ou ESTABLISHMENT_STAFF_MANAGEMENT.
    post:
      tags:
        - Établissements
      summary: Créer un établissement et inviter son administrateur
      description: Réservé au rôle ADMIN avec can_establishment_onboard. La création, le poste d'administrateur et l'invitation sont transactionnels.
      operationId: onboardEstablishment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardEstablishmentRequest'
      responses:
        '201':
          description: Établissement créé et invitation envoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentOnboardingResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Rôle ADMIN ou permission can_establishment_onboard absent.
        '409':
          description: Code établissement, matricule ou adresse email déjà utilisé.
  /api/v1/establishments/{establishmentId}:
    delete:
      tags:
        - Établissements
      summary: Désactiver un établissement
      description: Soft-delete; désactive également les membres et leurs comptes, puis révoque leurs refresh tokens. Requiert ADMIN_ACCESS, non attribué au rôle ADMIN d'onboarding.
      operationId: deactivateEstablishment
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Établissement et personnel désactivés.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN.
        '404':
          description: Établissement introuvable.

  /api/v1/establishments/{establishmentId}/roles:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les rôles accessibles dans un établissement
      description: Requiert can_role_read. Retourne les rôles système consultables et les rôles locaux; seul un rôle local est modifiable.
      operationId: getEstablishmentRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rôles système et locaux accessibles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablishmentRoleResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
    post:
      tags:
        - Administration de la sécurité
      summary: Créer un rôle local
      description: Requiert can_role_create. Les codes sont uniques dans toute la plateforme et les permissions plateforme sont refusées.
      operationId: createEstablishmentRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Rôle local créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRoleResponse'
        '400':
          description: Rôle ou permissions invalides, incluant une permission réservée à la plateforme.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
        '409':
          description: Code déjà utilisé par un rôle de la plateforme.

  /api/v1/establishments/{establishmentId}/roles/{code}:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: code
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    put:
      tags:
        - Administration de la sécurité
      summary: Modifier un rôle local
      description: Requiert can_role_update. Les rôles système et ceux d'un autre établissement ne sont pas modifiables.
      operationId: updateEstablishmentRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rôle local modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishmentRoleResponse'
        '400':
          description: Permissions invalides ou réservées à la plateforme.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.
        '404':
          description: Rôle local introuvable.

  /api/v1/establishments/{establishmentId}/permissions:
    parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Administration de la sécurité
      summary: Lister les permissions assignables dans un établissement
      description: Requiert can_permission_read. Le catalogue est en lecture seule et omet les permissions plateforme.
      operationId: getEstablishmentPermissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Catalogue des permissions assignables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission absente ou établissement hors périmètre.

  /api/v1/establishments/{establishmentId}/grade-levels:
    get:
      tags:
        - Catalogue scolaire
      summary: Lister les niveaux
      description: Requiert can_grade_level_read; les niveaux sont triés par ordre d'affichage puis par nom.
      operationId: getGradeLevels
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Niveaux actifs de l'établissement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeLevelResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_grade_level_read absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
    post:
      tags:
        - Catalogue scolaire
      summary: Créer un niveau
      description: Requiert can_grade_level_create; code et nom sont uniques dans l'établissement, et le code est normalisé en majuscules.
      operationId: createGradeLevel
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGradeLevelRequest'
      responses:
        '201':
          description: Niveau créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeLevelResponse'
        '400':
          description: Données invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_grade_level_create absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
        '409':
          description: Code ou nom déjà utilisé dans l'établissement.
  /api/v1/establishments/{establishmentId}/grade-levels/{gradeLevelId}:
    get:
      tags:
        - Catalogue scolaire
      summary: Consulter un niveau
      operationId: getGradeLevel
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Niveau.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeLevelResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_grade_level_read absente.
        '404':
          description: Niveau absent ou hors périmètre.
    patch:
      tags:
        - Catalogue scolaire
      summary: Modifier un niveau
      description: Requiert can_grade_level_update.
      operationId: updateGradeLevel
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGradeLevelRequest'
      responses:
        '200':
          description: Niveau modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeLevelResponse'
        '400':
          description: Données invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_grade_level_update absente.
        '404':
          description: Niveau absent ou hors périmètre.
        '409':
          description: Code déjà utilisé dans l'établissement.
    delete:
      tags:
        - Catalogue scolaire
      summary: Archiver un niveau
      description: Requiert can_grade_level_delete; refusé si une classe active le référence.
      operationId: archiveGradeLevel
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Niveau archivé.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_grade_level_delete absente.
        '404':
          description: Niveau absent ou hors périmètre.
        '409':
          description: Le niveau est utilisé par une classe active.

  /api/v1/establishments/{establishmentId}/subjects:
    get:
      tags:
        - Catalogue scolaire
      summary: Lister les matières
      description: Requiert can_subject_read.
      operationId: getSubjects
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matières actives de l'établissement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_read absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
    post:
      tags:
        - Catalogue scolaire
      summary: Créer une matière
      description: Requiert can_subject_create; le code est unique dans l'établissement et normalisé en majuscules.
      operationId: createSubject
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubjectRequest'
      responses:
        '201':
          description: Matière créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          description: Données invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_create absente.
        '404':
          description: Établissement absent, désactivé ou hors périmètre.
        '409':
          description: Code déjà utilisé dans l'établissement.
  /api/v1/establishments/{establishmentId}/subjects/{subjectId}:
    get:
      tags:
        - Catalogue scolaire
      summary: Consulter une matière
      operationId: getSubject
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matière.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_read absente.
        '404':
          description: Matière absente ou hors périmètre.
    patch:
      tags:
        - Catalogue scolaire
      summary: Modifier une matière
      description: Requiert can_subject_update.
      operationId: updateSubject
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubjectRequest'
      responses:
        '200':
          description: Matière modifiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectResponse'
        '400':
          description: Données invalides.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_update absente.
        '404':
          description: Matière absente ou hors périmètre.
        '409':
          description: Code déjà utilisé dans l'établissement.
    delete:
      tags:
        - Catalogue scolaire
      summary: Archiver une matière
      description: Requiert can_subject_delete; refusé si une classe active utilise cette matière.
      operationId: archiveSubject
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subjectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Matière archivée.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_subject_delete absente.
        '404':
          description: Matière absente ou hors périmètre.
        '409':
          description: La matière est utilisée par une classe active.

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes:
    get:
      tags:
        - Catalogue scolaire
      summary: Lister les classes d'une année
      description: Requiert can_school_class_read.
      operationId: getSchoolClasses
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Classes actives de l'année scolaire.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolClassResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_school_class_read absente.
        '404':
          description: Établissement ou année absente, désactivée ou hors périmètre.
    post:
      tags:
        - Catalogue scolaire
      summary: Créer une classe
      description: Requiert can_school_class_create. L'année et le niveau doivent appartenir au même établissement; le code est unique dans l'année et le nom dans le niveau.
      operationId: createSchoolClass
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:

          type: string
          format: uuid
          description: Autre salle active de cette école et de cette année.
        replaceExisting:
          type:
          - boolean
          - 'null'
          default: false
          description: true archive tous les créneaux actifs de la cible avant copie.
            Exige aussi can_timetable_delete.
        copyTeachers:
          type:
          - boolean
          - 'null'

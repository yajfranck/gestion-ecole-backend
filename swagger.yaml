    get:
      tags:
      - Inscriptions
      summary: Lister les inscriptions d'une année scolaire
      description: 'Autorisation fonctionnelle : hasAuthority(''can_enrollment_read'').
        Requiert can_enrollment_read; les résultats sont triés par date de création.'
      operationId: getEnrollments
      parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Inscriptions de l'année scolaire.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/EnrollmentResponse"
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: Année scolaire absente, désactivée ou hors périmètre.
      x-permission-expression: hasAuthority('can_enrollment_read')
      security:
      - bearerAuth: []
    post:
      tags:
      - Inscriptions
      summary: Inscrire un élève dans une classe
      description: 'Autorisation fonctionnelle : hasAuthority(''can_enrollment_create'')
        and (#request.payments() == null or #request.payments().isEmpty() or hasAuthority(''can_payment_record'')).
        Requiert can_enrollment_create, STUDENT_RECORDS et SCHOOL_MANAGEMENT actifs
        et l''accès à l''école. La salle sélectionnée ne doit pas avoir atteint maxStudents.
        Si des frais actifs s''appliquent, TUITION est aussi requis et le règlement
        intégral est exigé par défaut. acceptAdvance=true autorise un versement positif
        partiel; aucun paiement reste interdit si des frais s''appliquent. Tout encaissement
        exige can_payment_record. Inscription, créances et paiements sont atomiques.
        Sans frais applicables, paiement facultatif mais aucun frais étranger ne peut
        être payé. classroomId est obligatoire sauf si une seule salle est active.
        La décision et son auteur sont conservés; les frais ajoutés ultérieurement
        ne révoquent pas une inscription antérieure.'
      operationId: createEnrollment
      parameters:
      - name: establishmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: academicYearId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEnrollmentRequest"
            examples:
              advance:
                summary: Accepter une avance à l'inscription
                value:

        parent ou ADMIN plateforme implicite. Date obligatoire dans l’année. Heures
        locales sans conversion UTC. Les périodes de validité et les jours non ouvrés
        de l’année sont pris en compte; aucun week-end fermé implicitement. Une semaine
        contient sept journées du lundi au dimanche; les jours hors année ont withinAcademicYear=false

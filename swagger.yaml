  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms:
    parameters:
      - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Catalogue scolaire]
      summary: Lister les salles ou groupes d'une classe
      description: Requiert can_school_class_read, SCHOOL_MANAGEMENT actif et l'accès à cette école. Classe et année actives. Salles actives triées par nom puis identifiant. Chaque nouvelle classe possède une salle principale DEFAULT renommable.
      operationId: getClassrooms
      responses:
        '200':
          description: Salles actives de la classe.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ClassroomResponse'}}
        '400': {description: UUID invalide.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: École, année ou classe absente, archivée ou hors périmètre.}
    post:
      tags: [Catalogue scolaire]
      summary: Créer une salle ou un groupe dans une classe
      description: Requiert can_school_class_create, SCHOOL_MANAGEMENT actif et l'accès à l'école. Le code est unique dans la classe, y compris parmi les salles archivées. La série et les matières sont celles de la classe parente.
      operationId: createClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateClassroomRequest'}
            example: {code: B, name: Sixième B}
      responses:
        '201':
          description: Salle créée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomResponse'}
        '400': {description: UUID ou données invalides.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: École, année ou classe absente, archivée ou hors périmètre.}
        '409': {description: Code de salle déjà utilisé dans cette classe.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}:
    parameters:
      - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: classroomId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Catalogue scolaire]
      summary: Consulter une salle de classe
      description: Requiert can_school_class_read, SCHOOL_MANAGEMENT actif et l'accès à cette école. La salle doit être active et appartenir à la classe et à l'année indiquées.
      operationId: getClassroom
      responses:
        '200':
          description: Salle active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomResponse'}
        '400': {description: UUID invalide.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: Référence absente, archivée ou hors périmètre.}
    patch:
      tags: [Catalogue scolaire]
      summary: Modifier le code ou le nom d'une salle
      description: Requiert can_school_class_update, SCHOOL_MANAGEMENT actif et l'accès à cette école. Les champs omis ou null sont conservés. Le parent de la salle ne change pas.
      operationId: updateClassroom
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateClassroomRequest'}
            example: {name: Sixième A}
      responses:
        '200':
          description: Salle modifiée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClassroomResponse'}
        '400': {description: UUID ou données invalides.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: Référence absente, archivée ou hors périmètre.}
        '409': {description: Code de salle déjà utilisé dans la classe.}
    delete:
      tags: [Catalogue scolaire]
      summary: Archiver une salle sans élèves affectés ni créneaux actifs
      description: Requiert can_school_class_delete, SCHOOL_MANAGEMENT actif et l'accès à cette école. Refus si une inscription référence encore la salle, même pour un élève archivé, ou si un créneau actif la référence. L'archivage est logique.
      operationId: archiveClassroom
      responses:
        '204': {description: Salle archivée.}
        '400': {description: UUID invalide.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: Référence absente, archivée ou hors périmètre.}
        '409': {description: Salle encore référencée par une inscription ou un créneau actif.}

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/enrollments/{enrollmentId}:
    patch:
      tags: [Inscriptions]
      summary: Changer la salle d'un élève dans la même classe
      description: Requiert can_enrollment_update, STUDENT_RECORDS et SCHOOL_MANAGEMENT actifs et l'accès à l'école. Élève, classe, année et salle actifs. La salle doit appartenir à la classe actuelle. L'inscription et sa date de création sont conservées; les présences restent liées à l'inscription et aucun frais n'est réappliqué. La distribution par salle reflète l'affectation actuelle; aucun historique distinct de changement de salle n'est exposé.
      operationId: changeEnrollmentClassroom
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: enrollmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeEnrollmentClassroomRequest'}
      responses:
        '200':
          description: Inscription avec la salle mise à jour.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollmentResponse'}
        '400': {description: UUID ou corps invalide; classroomId absent ou null.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence insuffisante.}
        '404': {description: Inscription ou référence absente, archivée ou hors périmètre; salle d'une autre classe.}

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/enrollments:
    get:
      tags:
        - Inscriptions
      summary: Lister les inscriptions d'une année scolaire
      description: Requiert can_enrollment_read; les résultats sont triés par date de création.
      operationId: getEnrollments
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inscriptions de l'année scolaire.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_enrollment_read absente.
        '404':
          description: Année scolaire absente, désactivée ou hors périmètre.
    post:
      tags:
        - Inscriptions
      summary: Inscrire un élève dans une classe
      description: Requiert can_enrollment_create, STUDENT_RECORDS et SCHOOL_MANAGEMENT actifs et l'accès à l'école. Si des frais actifs s'appliquent, TUITION est aussi requis et le règlement intégral est exigé par défaut. acceptAdvance=true autorise un versement positif partiel; aucun paiement reste interdit si des frais s'appliquent. Tout encaissement exige can_payment_record. Inscription, créances et paiements sont atomiques. Sans frais applicables, paiement facultatif mais aucun frais étranger ne peut être payé. classroomId est obligatoire sauf si une seule salle est active. La décision et son auteur sont conservés; les frais ajoutés ultérieurement ne révoquent pas une inscription antérieure.
      operationId: createEnrollment
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
            examples:
              advance:
                summary: Accepter une avance à l'inscription
                value:
                  studentId: 11111111-1111-4111-8111-111111111111
                  schoolClassId: 22222222-2222-4222-8222-222222222222
                  classroomId: 33333333-3333-4333-8333-333333333333
                  acceptAdvance: true
                  payments:
                    - {feeId: 44444444-4444-4444-8444-444444444444, amount: 25, paymentMethodCode: CASH, reference: inscription}
              fullPayment:
                summary: Solder les frais applicables (exemple avec un frais de 100)
                value:
                  studentId: 11111111-1111-4111-8111-111111111111
                  schoolClassId: 22222222-2222-4222-8222-222222222222
                  payments:
                    - {feeId: 44444444-4444-4444-8444-444444444444, amount: 100, paymentMethodCode: CASH}
      responses:
        '201':
          description: Élève inscrit avec ses paiements et numéros de reçu; aucun encaissement n'est conservé en cas de refus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreationResponse'
        '400':
          description: Corps, UUID, montant ou moyen de paiement invalide; frais dupliqué; salle non choisie quand plusieurs salles sont actives.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_enrollment_create ou can_payment_record requise absente; licence ou accès à l'école insuffisant.
        '404':
          description: Élève, salle, classe, année, établissement ou frais absent, archivé ou hors périmètre.
        '409':
          description: Inscription déjà existante, surpaiement ou paiement ne satisfaisant pas la décision. Un paiement requis renvoie code=ENROLLMENT_PAYMENT_REQUIRED et unpaidFeeIds. Toutes les écritures de la tentative sont annulées.

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/students:

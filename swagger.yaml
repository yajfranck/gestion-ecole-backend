components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenu par POST /api/v1/login.
  schemas:
    SchoolYearRolloverFeeOverride:
      type: object
      properties:
        dueDate:
          type: string
          format: date
          description: Échéance explicite dans l’année cible.
        feeTypeId:
          type: string
          format: uuid
          description: Type actif du même établissement, pour remplacer notamment
            un type archivé.
    SchoolYearRolloverRequest:
      type: object
      properties:
        sourceAcademicYearId:
          type: string
          format: uuid
          description: Identifiant de la précédente disponible retournée par le GET.
        classroomIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: Salles sélectionnées de la source, même archivées.
        includeAnnualFees:
          type:
          - boolean
          - 'null'
          default: true
          description: 'Inclure les frais annuels. Omission ou null : true. Les frais
            des classes sélectionnées sont toujours repris.'
        feeOverrides:
          type: object
          maxProperties: 200
          propertyNames:
            type: string
            format: uuid
          additionalProperties:
            "$ref": "#/components/schemas/SchoolYearRolloverFeeOverride"
          description: 'Clé : UUID de frais source effectivement retenu. Aucune modification
            de la définition source.'
      required:
      - sourceAcademicYearId
      - classroomIds
    SchoolYearRolloverClassroom:
      type: object
      properties:
        classroom:
          "$ref": "#/components/schemas/ClassroomResponse"
        schoolClass:
          "$ref": "#/components/schemas/SchoolClassResponse"
        subjects:
          type: array
          items:
            "$ref": "#/components/schemas/SubjectResponse"
      required:
      - classroom
      - schoolClass
      - subjects
    SchoolYearRolloverPreview:
      type: object
      properties:
        targetYear:
          "$ref": "#/components/schemas/AcademicYearResponse"
        sourceYear:
          oneOf:
          - "$ref": "#/components/schemas/AcademicYearResponse"
          - type: 'null'
          description: Dernière année disponible finissant avant le début de la cible,
            même archivée ; null si absente.
        classrooms:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverClassroom"
        financeAvailable:
          type: boolean
          description: Accès TUITION par licence active. Les listes financières sont
            vides sinon.
        fees:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionFeeResponse"
          description: Définitions actives hors frais individuels, sans charge élève.
        feeTypes:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionFeeTypeResponse"
          description: Configuration active commune aux années de l’établissement.
        paymentMethods:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionPaymentMethodResponse"
          description: Modes actifs communs aux années, réutilisés sans duplication.
      required:
      - targetYear
      - sourceYear
      - classrooms
      - financeAvailable
      - fees
      - feeTypes
      - paymentMethods
    SchoolYearRolloverLink:
      type: object
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        created:
          type: boolean
          description: false si réutilisé, y compris si des classes sont ajoutées
            à un frais existant.
      required:
      - sourceId
      - targetId
      - created
    SchoolYearRolloverResponse:
      type: object
      properties:
        sourceAcademicYearId:
          type: string
          format: uuid
        targetAcademicYearId:
          type: string
          format: uuid
        classes:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        classrooms:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        subjectAssignmentsCreated:
          type: integer
          minimum: 0
          description: Affectations créées ou réactivées.
        skippedSubjectIds:
          type: array
          items:
            type: string
            format: uuid
          description: Matières affectées activement dans la source mais devenues
            inactives/absentes du catalogue.
        fees:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        createdBy:
          type: string
      required:
      - sourceAcademicYearId
      - targetAcademicYearId
      - classes
      - classrooms
      - subjectAssignmentsCreated
      - skippedSubjectIds
      - fees
      - createdBy
    TimetableDayOfWeek:
      type: string
      enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
    TimetableEntryRequest:
      type: object
      additionalProperties: false
      required:
      - subjectId
      - dayOfWeek
      - startTime
      - endTime
      properties:
        subjectId:
          type: string
          format: uuid
          description: Matière active affectée à la classe de cette salle.
        teacherId:
          type:
          - string
          - 'null'
          format: uuid
          description: Personnel actif de cette école, ou null pour enseignant à affecter.
        dayOfWeek:
          "$ref": "#/components/schemas/TimetableDayOfWeek"
        startTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:00)?$"
          description: 'Heure locale en minutes entières: HH:mm ou HH:mm:00.'
        endTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d(:00)?$"
          description: Fin strictement après le début dans la même journée.
        validFrom:
          type:
          - string
          - 'null'
          format: date
          description: Début inclusif dans l’année. Omis ou null reprend le début
            de l’année.
        validUntil:
          type:
          - string
          - 'null'
          format: date
          description: Fin inclusive dans l’année. Omis ou null reprend la fin de
            l’année. Au moins une occurrence du jour doit être incluse.
        roomCode:
          type:
          - string
          - 'null'
          maxLength: 40
          description: Local physique facultatif; nettoyé et mis en majuscules. Vide
            ou blanc devient null.
    TimetableEntryResponse:
      type: object
      required:
      - id
      - establishmentId
      - academicYearId
      - schoolClassId
      - classroomId
      - subjectId
      - teacherId
      - dayOfWeek
      - startTime
      - endTime
      - validFrom
      - validUntil
      - roomCode
      - enabled
      - copiedFromId
      - createdBy
      - updatedBy
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        establishmentId:
          type: string
          format: uuid
        academicYearId:
          type: string
          format: uuid
        schoolClassId:
          type: string
          format: uuid
        classroomId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
          description: Matière active affectée à la classe de cette salle.
        teacherId:
          type:
          - string
          - 'null'
          format: uuid
          description: Personnel actif de cette école, ou null pour enseignant à affecter.
        dayOfWeek:
          "$ref": "#/components/schemas/TimetableDayOfWeek"
        startTime:
          type: string
          example: '08:00:00'
        endTime:
          type: string
          example: '09:00:00'
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        roomCode:
          type:
          - string
          - 'null'
          maxLength: 40
          description: Local physique facultatif; nettoyé et mis en majuscules. Vide
            ou blanc devient null.
        enabled:
          type: boolean

---
openapi: 3.1.0
info:
  title: Gestion Ecole API
  version: 1.0.0
  description: Contrat HTTP du backend Gestion Ecole. Chaque opération sensible déclare
    une permission can_<entity>_<action> dans @PreAuthorize sur la méthode du contrôleur.
    Les expressions complètes figurent dans x-permission-expression. Les rôles administrateurs
    ne donnent aucune autorisation automatique et restent soumis aux licences. Les
    autorités JWT sont relues en base à chaque requête et limitées au rattachement
    demandé ; une révocation est effective avec un jeton déjà émis. Le périmètre plateforme
    est une habilitation explicite indépendante des permissions (security_role_scopes).
    Les données annuelles exigent establishmentId et academicYearId ; les ressources
    indépendantes d’une année ne l’exigent pas. Appliquer Flyway V18 et adapter les
    clients aux nouvelles routes du personnel, finances annuelles, portail parent
    annuel et dashboard établissement. Voir authorization-migration.md. Les catalogues
    de permissions retournent toutes les permissions, sans filtrage selon les droits
    du lecteur ; la délégation locale des permissions plateforme reste interdite.
servers:
- url: http://localhost:8080
  description: Serveur local
tags:
- name: Authentification
- name: Administration de la sécurité
- name: Établissements
- name: Catalogue scolaire
- name: Calendrier scolaire
- name: Élèves
- name: Parents et tuteurs
- name: Frais et paiements
- name: Inscriptions
- name: Postes
- name: Personnel
- name: Contenus pédagogiques
- name: Licences
- name: Dashboard
- name: Emplois du temps
- name: Reprise annuelle
- name: Santé
paths:
  "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classrooms/rollover":
    parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Établissement du membre connecté.
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Année scolaire cible active.
    get:
      tags:
      - Reprise annuelle
      operationId: previewSchoolYearRollover
      summary: Préparer la reprise de salles depuis la précédente année disponible
      description: 'Autorisation fonctionnelle : hasAuthority(''can_school_year_rollover'').
        Requiert can_school_year_rollover, compte/employé actif du même établissement
        et SCHOOL_MANAGEMENT, revérifiés en base. Source : fin la plus récente avant
        le début de la cible, puis début et UUID pour départager. Les années, classes
        et salles sources archivées sont proposées. Sans précédente : sourceYear=null,
        classrooms=[], fees=[]. Matières actives uniquement ; frais individuels exclus.
        Les types et moyens de paiement sont communs aux années. Sans TUITION, financeAvailable=false
        et toutes les listes financières sont vides. Aucun effet de bord.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Configuration source proposée, éventuellement sans précédente.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SchoolYearRolloverPreview"
        '400':
          description: Corps invalide, salles doublonnées, source autre que la précédente,
            échéance hors cible ou type non actif/hors établissement. Aucune écriture
            partielle.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: Cible inexistante/inactive/hors périmètre, salle hors source
            ou aucune précédente disponible au POST.
      x-permission-expression: hasAuthority('can_school_year_rollover')
      parameters: []
    post:
      tags:
      - Reprise annuelle
      operationId: copyPreviousSchoolYearClassrooms
      summary: Reprendre plusieurs salles, matières et paramétrage financier
      description: 'Autorisation fonctionnelle : hasAuthority(''can_school_year_rollover'').
        Requiert can_school_year_rollover et SCHOOL_MANAGEMENT ; TUITION si des frais
        sont retenus. Reprise atomique et répétable, années verrouillées. Copie des
        classes (code/nom/série) et seules salles choisies, actives en cible, sans
        DEFAULT implicite. Matières actives réutilisées, affectations cibles réactivées
        si nécessaire. Types/modes de paiement globaux réutilisés, type archivé à
        remplacer explicitement. Frais actifs annuels optionnels ou liés aux classes
        sélectionnées, hors frais individuels : montants/devises conservés, échéances
        décalées selon les années de début (29 février vers 28 février), surcharge
        possible. Frais multiclasse unique, étendu au fil des lots. Sans provenance,
        classe de même code/nom/série et salle de même code/nom compatibles réutilisées
        ; codes/noms des ressources déjà liées sont conservés. Frais de même nom réutilisable
        seulement si type, montant, devise, échéance et portée annuelle/classes correspondent.
        Aucun élève, inscription, créance/impayé, paiement, reçu, emploi du temps
        ou contenu pédagogique copié. Aucune facturation des inscriptions déjà présentes
        dans la cible ; application des frais ultérieure explicite via /tuition-fees/{feeId}/apply.
        Les frais copiés sont pris en compte aux futures inscriptions. Toute incompatibilité
        annule la transaction. Provenance et auteur enregistrés.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SchoolYearRolloverRequest"
            example:
              sourceAcademicYearId: 11111111-1111-4111-8111-111111111111
              classroomIds:
              - 22222222-2222-4222-8222-222222222222
              includeAnnualFees: true
      responses:
        '200':
          description: Correspondances source/cible et créations/réutilisations, y
            compris lors d’une répétition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SchoolYearRolloverResponse"
        '400':
          description: Corps invalide, salles doublonnées, source autre que la précédente,
            échéance hors cible ou type non actif/hors établissement. Aucune écriture
            partielle.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: Cible inexistante/inactive/hors périmètre, salle hors source
            ou aucune précédente disponible au POST.
        '409':
          description: Classe, salle ou frais cible incompatible/archivé ; conflit
            d’intégrité. Toute la demande est annulée.
      x-permission-expression: hasAuthority('can_school_year_rollover')
      parameters: []
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter le modèle hebdomadaire d’une salle
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_read'').
        Requiert can_timetable_read. Personnel actif rattaché à cette école, compte
        actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien
        au compte sont revérifiés en base. Année, classe et salle actives; aucun accès
        parent ou ADMIN plateforme implicite. Créneaux actifs triés par jour, heure
        et identifiant. Les jours non ouvrés ne retirent pas les créneaux du modèle.'
      operationId: getClassroomTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      parameters:
      - name: dayOfWeek
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/TimetableDayOfWeek"
      x-permission-expression: hasAuthority('can_timetable_read')
    post:
      tags:
      - Emplois du temps
      summary: Créer un créneau hebdomadaire pour une salle
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_create'').
        Requiert can_timetable_create. Personnel actif rattaché à cette école, compte
        actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien
        au compte sont revérifiés en base. Année, classe et salle actives; aucun accès
        parent ou ADMIN plateforme implicite. Matière active affectée à la classe.
        Enseignant facultatif, sinon personnel actif de l’école. Dates inclusives
        dans l’année et heures locales en minutes entières. Les chevauchements d’un
        même groupe, enseignant ou roomCode sont refusés, y compris entre années actives
        qui se recouvrent. Les fermetures ne libèrent pas les réservations du modèle.
        Les écritures d’une école sont sérialisées.'
      operationId: createClassroomTimetableEntry
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimetableEntryRequest"
            example:
              subjectId: 11111111-1111-4111-8111-111111111111
              teacherId: 22222222-2222-4222-8222-222222222222
              dayOfWeek: MONDAY
              startTime: '08:00'
              endTime: '09:00'
              validFrom: '2026-09-01'
              validUntil: '2027-06-30'
              roomCode: LAB-A
      responses:
        '201':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
      x-permission-expression: hasAuthority('can_timetable_create')
      parameters: []

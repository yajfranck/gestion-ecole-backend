      operationId: getClassroomWeeklyTimetable
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableWeekResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.

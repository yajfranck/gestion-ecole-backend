        '400':
          description: UUID de chemin ou filtre classroomId invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_enrollment_read absente.
        '404':
          description: Année, classe ou salle absente, archivée ou hors périmètre.


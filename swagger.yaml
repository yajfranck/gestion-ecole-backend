      summary: Lister les élèves inscrits dans une classe
      description: Requiert can_enrollment_read et l'accès à cette école; retourne uniquement les élèves actifs de la classe pour l'année scolaire indiquée. Le filtre facultatif classroomId doit désigner une salle active de cette classe et de cette année.
      operationId: getClassStudents

      summary: Lister les définitions de frais
      description: Requiert can_tuition_read.
      operationId: getTuitionFees
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Définitions de frais de l'année scolaire.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TuitionFeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_tuition_read absente.
        '404':
          description: Année scolaire absente ou hors périmètre.
    post:
      tags:
        - Frais et paiements
      summary: Définir un frais scolaire
      description: >-
        Requiert can_tuition_create et la fonctionnalité TUITION active dans le
        périmètre de l'établissement. schoolClassIds sélectionne une ou plusieurs
        classes actives de cette année et de cet établissement. Crée une seule
        définition avec le même montant et la même échéance pour chaque élève des
        classes choisies. L'ancien schoolClassId reste accepté, exclusivement.
        studentId ne peut être combiné avec une sélection de classes. Sans ciblage,
        le frais est annuel ; une liste vide, des doublons ou des UUID nuls sont
        refusés. La requête est atomique si une classe est invalide.
      operationId: createTuitionFee
      security:
        - bearerAuth: []
      parameters:

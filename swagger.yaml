        appartenir à la classe actuelle et ne pas avoir atteint maxStudents. L''inscription
        et sa date de création sont conservées; les présences restent liées à l''inscription
        et aucun frais n''est réappliqué. La distribution par salle reflète l''affectation
        actuelle; aucun historique distinct de changement de salle n''est exposé.'

        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      x-permission-expression: hasAuthority('can_timetable_read')
      parameters: []
    put:
      tags:
      - Emplois du temps
      summary: Remplacer les paramètres d’un créneau
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_update'').
        Requiert can_timetable_update. Personnel actif rattaché à cette école, compte
        actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien
        au compte sont revérifiés en base. Année, classe et salle actives; aucun accès
        parent ou ADMIN plateforme implicite. Corps complet: les enseignants/locaux
        omis deviennent null et les dates omises reprennent les bornes de l’année.
        Identité, salle, auteur/date de création et provenance de copie conservés.
        Vérification des matières, enseignants, dates et conflits comme à la création.'
      operationId: updateClassroomTimetableEntry
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimetableEntryRequest"
      responses:
        '200':
          description: Opération réussie.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
      x-permission-expression: hasAuthority('can_timetable_update')
      parameters: []
    delete:
      tags:
      - Emplois du temps
      summary: Archiver un créneau
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_delete'').
        Requiert can_timetable_delete. Personnel actif rattaché à cette école, compte
        actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien
        au compte sont revérifiés en base. Année, classe et salle actives; aucun accès
        parent ou ADMIN plateforme implicite. Archivage logique avec auteur et date,
        sans suppression de l’historique. Le créneau cesse de réserver les ressources.'
      operationId: archiveClassroomTimetableEntry
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Créneau archivé.
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
      x-permission-expression: hasAuthority('can_timetable_delete')
      parameters: []
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/copy"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Emplois du temps
      summary: Dupliquer un emploi du temps vers une autre salle
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_copy'')
        and (#request.replaceExisting() == null or !#request.replaceExisting() or
        hasAuthority(''can_timetable_delete'')). Requiert can_timetable_copy et, si
        replaceExisting=true, can_timetable_delete dans le jeton et en base. Personnel
        actif rattaché à cette école, compte actif non verrouillé et SCHOOL_MANAGEMENT
        requis. Les permissions et le lien au compte sont revérifiés en base. Année,
        classe et salle actives; aucun accès parent ou ADMIN plateforme implicite.
        Cible différente dans la même école et année. Une autre classe est permise
        si toutes les matières y sont actives et affectées. Source non vide. Par défaut
        ajout sans enseignants ni locaux physiques; teacherMappings prime sur copyTeachers.
        Conserver enseignants ou locaux peut créer un conflit avec la source. replaceExisting
        archive tous les créneaux actifs de la cible. Toutes les références et tous
        les conflits sont validés avant écriture; échec atomique sans altérer source
        ou destination. Nouveaux UUID et copiedFromId, auteur authentifié. Une copie
        répétée est soumise aux mêmes conflits.'
      operationId: copyClassroomTimetable
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CopyTimetableRequest"
            example:
              targetClassroomId: 33333333-3333-4333-8333-333333333333
              replaceExisting: false
              copyTeachers: false
              copyRoomCodes: false
              teacherMappings:
                22222222-2222-4222-8222-222222222222: 44444444-4444-4444-8444-444444444444
      responses:
        '201':
          description: Opération réussie.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TimetableEntryResponse"
        '400':
          description: UUID, jour, heures, période, corps ou mapping invalide; source
            vide ou identique à la destination.
        '401':
          description: JWT absent/invalide/expiré ou compte inactif/verrouillé.
        '403':
          description: Permission fonctionnelle, habilitation de périmètre ou fonctionnalité
            de licence manquante.
        '404':
          description: École, année, classe, salle, matière affectée, enseignant ou
            créneau absent, archivé ou hors périmètre.
        '409':
          description: Chevauchement de salle/groupe, enseignant ou local physique,
            ou conflit d’intégrité. conflictingEntryId identifie le premier créneau
            incompatible. Toute l’opération est annulée.
      x-permission-expression: hasAuthority('can_timetable_copy') and (#request.replaceExisting()
        == null or !#request.replaceExisting() or hasAuthority('can_timetable_delete'))
      parameters: []
  ? "/api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/classrooms/{classroomId}/timetable/day"
  : parameters:
    - name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: academicYearId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: schoolClassId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: classroomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Emplois du temps
      summary: Consulter les cours d’une journée
      description: 'Autorisation fonctionnelle : hasAuthority(''can_timetable_read'').
        Requiert can_timetable_read. Personnel actif rattaché à cette école, compte
        actif non verrouillé et SCHOOL_MANAGEMENT requis. Les permissions et le lien

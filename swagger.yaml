          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTuitionFeeRequest'
      responses:
        '201':
          description: Frais et créances initiales créés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeCreationResponse'
        '400':
          description: Montant, devise, échéance, UUID ou portée invalide ; liste de classes vide, doublons, valeurs nulles ou sélections incompatibles.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_tuition_create absente.
        '404':
          description: Année, classe ou élève absent ou hors périmètre.
        '409':
          description: Un frais de même nom existe déjà pour l'année.

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/tuition-fees/{feeId}/apply:
    post:
      tags:
        - Frais et paiements
      summary: Appliquer un frais aux inscriptions
      description: Requiert can_tuition_apply. Réutilise toutes les classes ciblées par le frais et crée uniquement les créances manquantes. L'application est idempotente.
      operationId: applyTuitionFee
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: feeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Application terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyTuitionFeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_tuition_apply absente.
        '404':
          description: Frais ou année absents ou hors périmètre.

  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/tuition-fees/outstanding:
    get:
      tags:
        - Frais et paiements
      summary: Lister les soldes impayés
      description: Requiert can_tuition_outstanding_read; overdue indique si l'échéance est passée.
      operationId: getOutstandingTuitionFees
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Créances dont le solde est positif.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentFeeChargeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_tuition_outstanding_read absente.
        '404':
          description: Année scolaire absente ou hors périmètre.

  /api/v1/establishments/{establishmentId}/students/{studentId}/tuition-fees:
    get:
      tags:
        - Frais et paiements
      summary: Consulter les frais et paiements d'un élève
      description: Requiert can_tuition_read; retourne le total payé, le solde et les paiements historiques.
      operationId: getStudentTuitionFees
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Créances de l'élève.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentFeeChargeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_tuition_read absente.
        '404':
          description: Élève absent ou hors périmètre.

  /api/v1/establishments/{establishmentId}/students/{studentId}/tuition-fees/{chargeId}/payments:
    post:
      tags:
        - Frais et paiements
      summary: Enregistrer un paiement scolaire
      description: Requiert can_payment_record. Le paiement ne peut pas dépasser le solde dû.
      operationId: recordTuitionPayment
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTuitionPaymentRequest'
      responses:
        '201':
          description: Paiement enregistré et reçu numéroté émis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TuitionPaymentResponse'
        '400':
          description: Montant invalide ou méthode de paiement non configurée.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_payment_record absente.
        '404':
          description: Élève ou créance absent ou hors périmètre.
        '409':
          description: Le paiement dépasse le solde dû.

  /api/v1/establishments/{establishmentId}/payments/{paymentId}/receipt:
    get:
      tags:
        - Frais et paiements
      summary: Retrouver un reçu de paiement
      description: Requiert can_payment_receipt_read. Le reçu retourne les données élève figées lors de la créance.
      operationId: getTuitionPaymentReceipt
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reçu JSON immuable du paiement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_payment_receipt_read absente.
        '404':
          description: Paiement absent ou hors périmètre.

  /api/v1/establishments/{establishmentId}/students/{studentId}/guardians:
    get:
      tags:
        - Parents et tuteurs
      summary: Lister les tuteurs d'un élève
      description: Requiert can_guardian_read et le périmètre de l'établissement.
      operationId: getStudentGuardians
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tuteurs actifs liés à l'élève.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardianResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_guardian_read absente.
        '404':
          description: Élève absent, archivé ou hors périmètre.
    post:
      tags:
        - Parents et tuteurs
      summary: Lier un tuteur à un élève
      description: >-
        Requiert can_guardian_link et un élève dans le périmètre de l'établissement.
        Toute personne peut être tuteur, y compris un tuteur existant, un membre
        du personnel ou un administrateur. Le compte correspondant à l'e-mail est
        réutilisé avec ajout du rôle PARENT, sans changer ses autres rôles, son mot
        de passe ni ses états activé/verrouillé. Sans compte existant, une invitation
        est envoyée. Un compte réutilisé reçoit ACCESS_ALREADY_ACTIVE ; renouveler
        les jetons ou se reconnecter pour obtenir les nouvelles permissions.
      operationId: linkGuardian
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkGuardianRequest'
      responses:
        '201':
          description: Tuteur lié et invitation envoyée ou accès existant confirmé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianLinkResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_guardian_link absente.
        '404':
          description: Élève absent, archivé ou hors périmètre.
        '409':
          description: Tuteur déjà lié, conflit d'unicité ou adresse réattribuée associée à une autre identité. Un compte existant pour cet e-mail est normalement réutilisé.

  /api/v1/establishments/{establishmentId}/students/{studentId}/guardians/{guardianId}:
    delete:
      tags:
        - Parents et tuteurs
      summary: Retirer le lien d'un tuteur
      description: Requiert can_guardian_unlink. Le compte parent reste actif.
      operationId: unlinkGuardian
      security:
        - bearerAuth: []
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: guardianId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Lien retiré.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_guardian_unlink absente.
        '404':
          description: Élève ou lien absent ou hors périmètre.

  /api/v1/guardians/invitations/accept:
    post:
      tags:
        - Parents et tuteurs
      summary: Accepter une invitation parent
      description: Route publique; crée le compte parent depuis un jeton à usage unique valable 48 heures.
      operationId: acceptGuardianInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptGuardianInvitationRequest'
      responses:
        '204':
          description: Compte parent activé.
        '400':
          description: Corps invalide ou mot de passe ne respectant pas les contraintes.
        '401':
          description: Jeton invalide, expiré ou déjà utilisé.
        '409':
          description: Un compte existe déjà pour cette adresse.

  /api/v1/guardians/me/children:
    get:
      tags:
        - Parents et tuteurs
      summary: Lister les enfants du parent connecté
      description: >-
        Requiert can_guardian_read_children, y compris pour un membre du personnel
        ou administrateur également tuteur. Le périmètre vient des liens du compte
        authentifié, conservés après un changement de login du personnel.
      operationId: getMyChildren
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Élèves actifs liés au tuteur et appartenant à des établissements actifs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuardianChildResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission can_guardian_read_children absente.

  /api/v1/establishments/{establishmentId}/positions:
    get:
      tags:
        - Postes
      summary: Lister les postes d'un établissement
      description: Requiert can_position_read; le service applique le périmètre de l'établissement.
      operationId: getPositions
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Postes de l'établissement.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte sans autorisation sur l'établissement.
    post:
      tags:
        - Postes
      summary: Créer un poste dans un établissement
      description: Requiert can_position_create. Les rôles actifs du catalogue, y compris les rôles personnalisés, sont hérités par les membres; ADMIN et PARENT sont réservés.
      operationId: createPosition
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
      responses:
        '201':
          description: Poste créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          description: Corps invalide ou rôle non attribuable.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte sans autorisation sur l'établissement.
        '404':
          description: Établissement introuvable ou désactivé.
        '409':
          description: Nom déjà utilisé dans cet établissement.
  /api/v1/establishments/{establishmentId}/positions/{positionId}:
    patch:
      tags:
        - Postes
      summary: Renommer un poste
      description: Requiert can_position_update; le service vérifie le périmètre de l'établissement.
      operationId: updatePosition
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
      responses:
        '200':
          description: Poste renommé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte sans autorisation sur l'établissement.
        '404':
          description: Poste absent ou hors établissement.
        '409':
          description: Nom déjà utilisé dans cet établissement.
    delete:
      tags:
        - Postes
      summary: Désactiver un poste
      description: Requiert can_position_delete. La désactivation est refusée tant que des membres sont rattachés au poste.
      operationId: deactivatePosition
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Poste désactivé.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte sans autorisation sur l'établissement.
        '404':
          description: Poste absent ou hors établissement.
        '409':
          description: Des membres sont encore rattachés au poste.
  /api/v1/establishments/{establishmentId}/positions/{positionId}/roles:
    put:
      tags:
        - Postes
      summary: Remplacer les rôles hérités d'un poste
      description: Requiert can_position_assign_roles. Synchronise les rôles effectifs des comptes actifs de ses titulaires; les rôles directs sont conservés.
      operationId: updatePositionRoles
      parameters:
        - name: establishmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: positionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRolesRequest'
      responses:
        '200':
          description: Rôles du poste remplacés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          description: Rôle inexistant, désactivé ou réservé (ADMIN/PARENT).
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Compte sans autorisation sur l'établissement.
        '404':
          description: Poste absent ou hors établissement.

  /api/v1/employees:
    get:
      tags:
        - Personnel
      summary: Lister le personnel accessible
      description: Requiert ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT. L'administrateur global voit tous les établissements; le responsable voit uniquement le sien.
      operationId: getEmployees
      responses:
        '200':
          description: Liste de fiches de personnel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
    post:
      tags:
        - Personnel
      summary: Créer une fiche et envoyer une invitation
      description: Requiert ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT. Un administrateur d'établissement ne peut inviter que dans son établissement et ne peut attribuer directement ESTABLISHMENT_ADMIN; le rôle peut être hérité du poste choisi.
      operationId: inviteEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Fiche créée et invitation envoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeInvitationResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission manquante ou fiche/établissement hors périmètre.
        '409':
          description: L'email ou le matricule existe déjà.
        '503':
          description: Le service de courriel est indisponible.
  /api/v1/employees/{employeeId}:
    get:
      tags:
        - Personnel
      summary: Consulter une fiche de personnel
      operationId: getEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fiche visible dans le périmètre de l'appelant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
    patch:
      tags:
        - Personnel
      summary: Modifier les informations d'une fiche
      description: Mise à jour partielle; au moins un champ est requis. La modification de l'email synchronise le login.
      operationId: updateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Fiche mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Aucun champ fourni ou valeur invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
        '409':
          description: Email ou matricule déjà utilisé.
    delete:
      tags:
        - Personnel
      summary: Désactiver une fiche de personnel
      description: Soft-delete de la fiche, désactivation du compte associé et révocation de ses refresh tokens.
      operationId: deactivateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fiche et compte désactivés.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
  /api/v1/employees/{employeeId}/roles:
    put:
      tags:
        - Personnel
      summary: Remplacer les rôles d'un membre du personnel
      description: Les permissions sont héritées des rôles. ADMIN peut attribuer STAFF ou ESTABLISHMENT_ADMIN; ESTABLISHMENT_ADMIN ne peut attribuer que STAFF et ne peut pas promouvoir un autre administrateur.
      operationId: updateEmployeeRoles
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRolesRequest'
      responses:
        '200':
          description: Rôles remplacés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Rôle non attribuable, incluant ADMIN.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission manquante ou cible hors périmètre; les rôles directs non attribuables sont refusés en 400.
        '404':
          description: Fiche absente ou hors périmètre.

  /api/v1/employees/me:
    get:
      tags:
        - Personnel
      summary: Obtenir sa propre fiche
      description: Requiert la permission STAFF_ACCESS.
      operationId: getCurrentEmployee
      responses:
        '200':
          description: Fiche du membre du personnel connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission STAFF_ACCESS.
        '404':
          description: Aucun membre du personnel n'est associé au compte.

  /api/v1/employees/invitations/accept:
    post:
      tags:
        - Personnel
      summary: Accepter une invitation et définir son mot de passe
      description: Le token est à usage unique et expire après 48 heures. Cette opération ne requiert pas encore de JWT.
      operationId: acceptEmployeeInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptEmployeeInvitationRequest'
      responses:
        '204':
          description: Invitation acceptée; le membre peut maintenant se connecter avec son email.
        '400':
          description: Token ou mot de passe invalide.
        '401':
          description: Invitation inconnue, expirée ou déjà utilisée.

  /api/v1/guardians/me/children/{studentId}/summary:
    get:
      tags: [Parents et tuteurs]
      summary: Consulter le résumé scolaire et financier d'un enfant
      operationId: getGuardianChildSummary
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Résumé de l'enfant lié au parent authentifié.}
        '403': {description: Permission ou licence parent absente.}
        '404': {description: Enfant, année ou inscription active introuvable.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/tuition-fees:
    get:
      tags: [Parents et tuteurs]
      summary: Lister les frais scolaires d'un enfant
      operationId: getGuardianChildTuitionFees
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Créances, paiements et soldes de l'année demandée.}
        '403': {description: Permission ou fonctionnalité TUITION/PARENT_PORTAL absente.}
        '404': {description: Enfant lié, année ou inscription active introuvable.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/tuition-fees/{chargeId}/payments:
    get:
      tags: [Parents et tuteurs]
      summary: Consulter l'historique des paiements d'une créance
      operationId: getGuardianChildPayments
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: chargeId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Paiements dans la plage inclusive, limitée à 366 jours.}
        '400': {description: Plage de dates invalide.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Créance ou enfant lié introuvable.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/attendance:
    get:
      tags: [Parents et tuteurs]
      summary: Consulter les présences communiquées au parent
      operationId: getGuardianChildAttendance
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Historique limité au commentaire parent, sans commentaire interne ni identité du personnel.}
        '400': {description: Plage de dates invalide.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Enfant lié, année ou inscription introuvable.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/learning-content:
    get:
      tags: [Parents et tuteurs, Contenus pédagogiques]
      summary: Lister les contenus publiés de la classe de l'enfant
      operationId: getGuardianLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/LearningContentType'}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Liste paginée des contenus publiés de l'inscription active.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Enfant lié, année ou inscription introuvable.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content:
    get:
      tags: [Contenus pédagogiques]
      summary: Lister les contenus d'une classe
      operationId: getLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/LearningContentType'}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Page de contenus, brouillons inclus pour le personnel autorisé.}
        '400': {description: Pagination invalide.}
        '403': {description: Permission ou licence LEARNING_CONTENT absente.}
        '404': {description: Classe ou année introuvable.}
    post:
      tags: [Contenus pédagogiques]
      summary: Créer un contenu brouillon
      description: >-
        Requiert can_learning_content_create et le périmètre de gestion de la classe.
        La classe et l'année de l'URL sont obligatoires et actives. subjectId est
        obligatoire et doit désigner une matière affectée à cette classe dans le
        même établissement, pour LESSON comme pour ASSIGNMENT.
      operationId: createLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningContentRequest'}
      responses:
        '201': {description: Brouillon créé.}
        '400': {description: Corps, type, UUID ou date limite invalide ; subjectId absent/nul ou matière non affectée à la classe.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Classe ou année introuvable.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content/{contentId}:
    get:
      tags: [Contenus pédagogiques]
      summary: Consulter un contenu non archivé
      operationId: getLearningContentById
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contenu de classe.}
        '403': {description: Permission absente ou hors périmètre.}
        '404': {description: Contenu introuvable ou archivé.}
    put:
      tags: [Contenus pédagogiques]
      summary: Mettre à jour un contenu non archivé
      description: >-
        Requiert can_learning_content_update. subjectId est obligatoire et son
        affectation active à la classe est vérifiée à nouveau. Le type et la classe
        du contenu ne peuvent pas changer. Une modification le replace en DRAFT.
      operationId: updateLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LearningContentRequest'}
      responses:
        '200': {description: Contenu mis à jour.}
        '400': {description: Requête ou type modifié invalide ; subjectId absent/nul ou matière non affectée à la classe.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission absente ou hors périmètre.}
        '404': {description: Contenu introuvable.}
        '409': {description: État incompatible ou conflit d'intégrité.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content/{contentId}/publish:
    post:
      tags: [Contenus pédagogiques]
      summary: Publier un brouillon
      description: >-
        Requiert can_learning_content_publish. Vérifie à nouveau que la matière du
        contenu est affectée à la classe avant publication. Aucun corps ni paramètre
        de requête ; la classe, l'année et le contenu sont identifiés dans l'URL.
      operationId: publishLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contenu publié.}
        '400': {description: Matière absente ou qui n'est plus affectée à la classe.}
        '401': {description: JWT absent, invalide ou expiré.}
        '403': {description: Permission absente.}
        '404': {description: Contenu introuvable.}
        '409': {description: Le contenu n'est pas un brouillon.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content/{contentId}/archive:
    post:
      tags: [Contenus pédagogiques]
      summary: Archiver un contenu
      operationId: archiveLearningContent
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contenu archivé.}
        '403': {description: Permission absente.}
        '404': {description: Contenu introuvable.}
  /api/v1/establishments/{establishmentId}/license:
    get:
      tags: [Licences]
      summary: Lire les licences d'un établissement
      operationId: getEstablishmentLicenses
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Licences et état courant.}
        '403': {description: Permission can_license_read absente ou établissement hors périmètre.}
        '404': {description: Établissement introuvable.}
  /api/v1/admin/license-offers:
    get:
      tags: [Licences]
      summary: Lister les offres actives
      operationId: getLicenseOffers
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Offres configurées.}
        '403': {description: Rôle ADMIN requis.}
    post:
      tags: [Licences]
      summary: Créer une offre
      operationId: createLicenseOffer
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLicenseOfferRequest'}
      responses:
        '201': {description: Offre créée.}
        '400': {description: Code, nom ou fonctionnalités invalides.}
        '403': {description: Rôle ADMIN requis.}
        '409': {description: Code déjà utilisé.}
  /api/v1/admin/establishments/{establishmentId}/licenses:
    post:
      tags: [Licences]
      summary: Attribuer ou remplacer une licence
      operationId: assignEstablishmentLicense
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignLicenseRequest'}
      responses:
        '201': {description: Licence attribuée et événement d'audit enregistré.}
        '400': {description: Période invalide.}
        '403': {description: Rôle ADMIN requis.}
        '404': {description: Offre ou établissement introuvable.}
        '409': {description: Chevauchement de licence incompatible.}
  /api/v1/admin/establishments/{establishmentId}/licenses/{licenseId}/suspend:
    post:
      tags: [Licences]
      summary: Suspendre une licence
      operationId: suspendEstablishmentLicense
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: licenseId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Licence suspendue.}
        '403': {description: Rôle ADMIN requis.}
        '404': {description: Licence ou établissement introuvable.}
        '409': {description: Licence expirée ou déjà suspendue.}
  /api/v1/admin/establishments/{establishmentId}/licenses/{licenseId}/reactivate:
    post:
      tags: [Licences]
      summary: Réactiver une licence suspendue non expirée
      operationId: reactivateEstablishmentLicense
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: licenseId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Licence réactivée.}
        '403': {description: Rôle ADMIN requis.}
        '404': {description: Licence ou établissement introuvable.}
        '409': {description: Licence non suspendue ou expirée.}
  /api/v1/admin/establishments/{establishmentId}/licenses/{licenseId}/end:
    post:
      tags: [Licences]
      summary: Terminer immédiatement une licence
      operationId: endEstablishmentLicense
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: licenseId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Licence terminée.}
        '403': {description: Rôle ADMIN requis.}
        '404': {description: Licence ou établissement introuvable.}
        '409': {description: Licence déjà échue ou pas encore commencée.}
  /api/v1/admin/establishments/{establishmentId}/licenses/{licenseId}/events:
    get:
      tags: [Licences]
      summary: Consulter l'audit d'une licence
      operationId: getEstablishmentLicenseEvents
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: licenseId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        '200': {description: Événements d'audit chronologiques.}
        '403': {description: Rôle ADMIN requis.}
        '404': {description: Licence ou établissement introuvable.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content/{contentId}/attachments:
    get:
      tags: [Contenus pédagogiques]
      summary: Lister les pièces jointes staff
      operationId: getLearningAttachments
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Métadonnées sans chemin ni clé de stockage.}
        '403': {description: Permission absente ou hors périmètre.}
        '404': {description: Contenu introuvable.}
    post:
      tags: [Contenus pédagogiques]
      summary: Ajouter une pièce jointe à un brouillon
      operationId: uploadLearningAttachment
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Fichier stocké en espace privé et métadonnées créées.}
        '400': {description: Type MIME/extension non autorisé ou taille invalide.}
        '403': {description: Permission absente ou hors périmètre.}
        '404': {description: Contenu introuvable.}
        '409': {description: Le contenu n'est plus un brouillon.}
  /api/v1/establishments/{establishmentId}/school-years/{academicYearId}/classes/{schoolClassId}/learning-content/{contentId}/attachments/{attachmentId}:
    get:
      tags: [Contenus pédagogiques]
      summary: Télécharger une pièce jointe staff
      operationId: downloadLearningAttachment
      security: [{bearerAuth: []}]
      parameters:
        - {name: establishmentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: schoolClassId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Fichier privé transmis comme pièce jointe.}
        '403': {description: Permission absente ou hors périmètre.}
        '404': {description: Contenu ou pièce jointe introuvable.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/learning-content/{contentId}:
    get:
      tags: [Parents et tuteurs, Contenus pédagogiques]
      summary: Consulter un contenu publié
      operationId: getGuardianLearningContentById
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Contenu publié de la classe active de l'enfant.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Contenu non publié ou hors inscription.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/learning-content/{contentId}/attachments:
    get:
      tags: [Parents et tuteurs, Contenus pédagogiques]
      summary: Lister les pièces jointes d'un contenu publié
      operationId: getGuardianLearningAttachments
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Métadonnées des fichiers publiés.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Contenu non publié ou hors inscription.}
  /api/v1/guardians/me/children/{studentId}/school-years/{academicYearId}/learning-content/{contentId}/attachments/{attachmentId}:
    get:
      tags: [Parents et tuteurs, Contenus pédagogiques]
      summary: Télécharger une pièce jointe publiée
      operationId: downloadGuardianLearningAttachment
      security: [{bearerAuth: []}]
      parameters:
        - {name: studentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: contentId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: attachmentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Fichier privé transmis comme pièce jointe.}
        '403': {description: Permission ou licence absente.}
        '404': {description: Contenu non publié ou pièce jointe hors périmètre.}

  /actuator/health:
    get:
      tags:
        - Santé
      summary: Vérifier l'état de santé de l'application
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Application disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
        '503':
          description: Application ou dépendance non disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenu par POST /api/v1/login.
  schemas:
    SchoolYearRolloverFeeOverride:
      type: object
      properties:
        dueDate:
          type: string
          format: date
          description: Échéance explicite dans l’année cible.
        feeTypeId:
          type: string
          format: uuid
          description: Type actif du même établissement, pour remplacer notamment un type
            archivé.
    SchoolYearRolloverRequest:
      type: object
      properties:
        sourceAcademicYearId:
          type: string
          format: uuid
          description: Identifiant de la précédente disponible retournée par le GET.
        classroomIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: Salles sélectionnées de la source, même archivées.
        includeAnnualFees:
          type:
          - boolean
          - 'null'
          default: true
          description: 'Inclure les frais annuels. Omission ou null : true. Les frais
            des classes sélectionnées sont toujours repris.'
        feeOverrides:
          type: object
          maxProperties: 200
          propertyNames:
            type: string
            format: uuid
          additionalProperties:
            "$ref": "#/components/schemas/SchoolYearRolloverFeeOverride"
          description: 'Clé : UUID de frais source effectivement retenu. Aucune modification
            de la définition source.'
      required:
      - sourceAcademicYearId
      - classroomIds
    SchoolYearRolloverClassroom:
      type: object
      properties:
        classroom:
          "$ref": "#/components/schemas/ClassroomResponse"
        schoolClass:
          "$ref": "#/components/schemas/SchoolClassResponse"
        subjects:
          type: array
          items:
            "$ref": "#/components/schemas/SubjectResponse"
      required:
      - classroom
      - schoolClass
      - subjects
    SchoolYearRolloverPreview:
      type: object
      properties:
        targetYear:
          "$ref": "#/components/schemas/AcademicYearResponse"
        sourceYear:
          oneOf:
          - "$ref": "#/components/schemas/AcademicYearResponse"
          - type: 'null'
          description: Dernière année disponible finissant avant le début de la cible,
            même archivée ; null si absente.
        classrooms:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverClassroom"
        financeAvailable:
          type: boolean
          description: Licence TUITION active. Les listes financières sont vides sinon.
        fees:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionFeeResponse"
          description: Définitions actives hors frais individuels, sans charge élève.
        feeTypes:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionFeeTypeResponse"
          description: Configuration active commune aux années de l’établissement.
        paymentMethods:
          type: array
          items:
            "$ref": "#/components/schemas/TuitionPaymentMethodResponse"
          description: Modes actifs communs aux années, réutilisés sans duplication.
      required:
      - targetYear
      - sourceYear
      - classrooms
      - financeAvailable
      - fees
      - feeTypes
      - paymentMethods
    SchoolYearRolloverLink:
      type: object
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        created:
          type: boolean
          description: false si réutilisé, y compris si des classes sont ajoutées à un
            frais existant.
      required:
      - sourceId
      - targetId
      - created
    SchoolYearRolloverResponse:
      type: object
      properties:
        sourceAcademicYearId:
          type: string
          format: uuid
        targetAcademicYearId:
          type: string
          format: uuid
        classes:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        classrooms:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        subjectAssignmentsCreated:
          type: integer
          minimum: 0
          description: Affectations créées ou réactivées.
        skippedSubjectIds:
          type: array
          items:
            type: string
            format: uuid
          description: Matières affectées activement dans la source mais devenues inactives/absentes
            du catalogue.
        fees:
          type: array
          items:
            "$ref": "#/components/schemas/SchoolYearRolloverLink"
        createdBy:
          type: string
      required:
      - sourceAcademicYearId
      - targetAcademicYearId
      - classes
      - classrooms
      - subjectAssignmentsCreated
      - skippedSubjectIds
      - fees
      - createdBy
    TimetableDayOfWeek:
      type: string
      enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY

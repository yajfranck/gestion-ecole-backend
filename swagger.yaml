        - Personnel
      summary: Lister le personnel accessible
      description: Requiert ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT. L'administrateur global voit tous les établissements; le responsable voit uniquement le sien.
      operationId: getEmployees
      responses:
        '200':
          description: Liste de fiches de personnel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
    post:
      tags:
        - Personnel
      summary: Créer une fiche et envoyer une invitation
      description: Requiert ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT. Un administrateur d'établissement ne peut inviter que dans son établissement et ne peut attribuer directement ESTABLISHMENT_ADMIN; le rôle peut être hérité du poste choisi.
      operationId: inviteEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Fiche créée et invitation envoyée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeInvitationResponse'
        '400':
          description: Corps invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission manquante ou fiche/établissement hors périmètre.
        '409':
          description: L'email ou le matricule existe déjà.
        '503':
          description: Le service de courriel est indisponible.
  /api/v1/employees/{employeeId}:
    get:
      tags:
        - Personnel
      summary: Consulter une fiche de personnel
      operationId: getEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fiche visible dans le périmètre de l'appelant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
    patch:
      tags:
        - Personnel
      summary: Modifier les informations d'une fiche
      description: Mise à jour partielle; au moins un champ est requis. La modification de l'email synchronise le login.
      operationId: updateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Fiche mise à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Aucun champ fourni ou valeur invalide.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
        '409':
          description: Email ou matricule déjà utilisé.
    delete:
      tags:
        - Personnel
      summary: Désactiver une fiche de personnel
      description: Soft-delete de la fiche, désactivation du compte associé et révocation de ses refresh tokens.
      operationId: deactivateEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fiche et compte désactivés.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas ADMIN_ACCESS ou ESTABLISHMENT_STAFF_MANAGEMENT.
        '404':
          description: Fiche absente ou hors périmètre.
  /api/v1/employees/{employeeId}/roles:
    put:
      tags:
        - Personnel
      summary: Remplacer les rôles d'un membre du personnel
      description: Les permissions sont héritées des rôles. ADMIN peut attribuer STAFF ou ESTABLISHMENT_ADMIN; ESTABLISHMENT_ADMIN ne peut attribuer que STAFF et ne peut pas promouvoir un autre administrateur.
      operationId: updateEmployeeRoles
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRolesRequest'
      responses:
        '200':
          description: Rôles remplacés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Rôle non attribuable, incluant ADMIN.
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Permission manquante ou cible hors périmètre; les rôles directs non attribuables sont refusés en 400.
        '404':
          description: Fiche absente ou hors périmètre.

  /api/v1/employees/me:
    get:
      tags:
        - Personnel
      summary: Obtenir sa propre fiche
      description: Requiert la permission STAFF_ACCESS.
      operationId: getCurrentEmployee
      responses:
        '200':
          description: Fiche du membre du personnel connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '401':
          description: JWT absent, invalide ou expiré.
        '403':
          description: Le compte ne possède pas la permission STAFF_ACCESS.
        '404':
          description: Aucun membre du personnel n'est associé au compte.

  /api/v1/employees/invitations/accept:
    post:
      tags:
        - Personnel
      summary: Accepter une invitation et définir son mot de passe
      description: Le token est à usage unique et expire après 48 heures. Cette opération ne requiert pas encore de JWT.
      operationId: acceptEmployeeInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptEmployeeInvitationRequest'
      responses:
        '204':
          description: Invitation acceptée; le membre peut maintenant se connecter avec son email.
        '400':
          description: Token ou mot de passe invalide.
        '401':
          description: Invitation inconnue, expirée ou déjà utilisée.

  /actuator/health:
    get:
      tags:
        - Santé
      summary: Vérifier l'état de santé de l'application
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Application disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
        '503':
          description: Application ou dépendance non disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenu par POST /api/v1/login.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: Nom d'utilisateur, obligatoire et non blanc.
          example: admin-tech
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Mot de passe, obligatoire et non blanc.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
          description: Au moins 12 caractères et au plus 72 octets après encodage UTF-8; doit différer du mot de passe actuel.
    TokenResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
        - refreshExpiresIn
      properties:
        accessToken:
          type: string
          description: JWT signé en HS256.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Durée de validité du JWT d'accès en secondes.
          example: 900
        refreshToken:
          type: string
          description: Jeton opaque à conserver de manière sécurisée et à remplacer après chaque renouvellement.
        refreshExpiresIn:
          type: integer
          format: int64
          description: Durée de validité du refresh token en secondes.
          example: 2592000
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
    UserAccountResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - enabled
        - locked
        - createdAt
        - updatedAt
        - lastLoginAt
        - roles
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        enabled:
          type: boolean
        locked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
        roles:
          type: array
          items:
            type: string
          description: Codes des rôles de l'utilisateur.
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - permissionCodes
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]*$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 255
        permissionCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 64
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - permissionCodes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type:
            - string
            - 'null'
          maxLength: 255
        permissionCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            maxLength: 64
    RoleResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - description
        - enabled
        - permissions
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
    EstablishmentRoleResponse:
      type: object
      additionalProperties: false
      required:
        - establishmentId
        - code
        - name
        - enabled
        - editable
        - permissions
      properties:
        establishmentId:
          type:
            - string
            - 'null'
          format: uuid
          description: Null pour un rôle système global.
        code:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
        editable:
          type: boolean
          description: Indique si le rôle appartient à l’établissement et peut être modifié.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResponse'
    PermissionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - description
      properties:
        code:
          type: string
        description:
          type: string
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: État de santé de l'application.
          example: UP
    EstablishmentAdministratorRequest:
      type: object
      additionalProperties: false
      required:
        - employeeNumber
        - firstName
        - lastName
        - email
      properties:
        employeeNumber:
          type: string
          minLength: 1
          maxLength: 40
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
    OnboardEstablishmentRequest:
      type: object
      additionalProperties: false
      required:
